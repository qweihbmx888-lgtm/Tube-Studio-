<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>TubePilot Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#07040f;--g:#22e55c;--ln:#5b2bd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:#fff;font-family:Cairo,"Segoe UI",Tahoma,sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:130px;background:radial-gradient(circle at 75% 0,#3a1285 0,transparent 45%),radial-gradient(circle at 0 65%,#2a0b6a 0,transparent 40%),var(--bg)}
img{display:block}html,body{overflow-x:hidden;max-width:100vw}.sc{mix-blend-mode:screen}
header{direction:ltr;display:flex;align-items:center;gap:8px;padding:12px 14px 6px;height:96px;position:relative}
header button{background:none;border:0;padding:0;width:44px;height:44px;cursor:pointer}header button img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.lg{position:absolute;left:50%;transform:translateX(-50%);top:6px;text-align:center;line-height:.92}.lg img{width:54px;margin:0 auto}.lg b{display:block;font-size:21px;font-weight:800}.lg span{display:block;font-size:21px;font-weight:800;background:linear-gradient(90deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{margin-left:auto;width:56px;height:56px;border-radius:50%;object-fit:cover}
main{padding:6px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.cd{border-radius:24px;padding:14px;background:linear-gradient(145deg,#2b1466dd,#0f0824f2);border:1.5px solid var(--ln);box-shadow:0 0 22px #7c3aed40,inset 0 0 24px #7c3aed22}
.hb{display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}.hb .ht{flex:1}.hb h2{font-size:19px;font-weight:800;line-height:1.35}.hb p{color:#c9b8f5;font-size:13px;margin:6px 0 12px}.hb img{width:42%;max-width:190px;border-radius:18px}
.pb{border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,#6d28d9,#8b5cf6);box-shadow:0 0 14px #8b5cf688;cursor:pointer}.pb.w{width:100%;border-radius:18px;padding:13px;font-size:16px}.pb:disabled{opacity:.5}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}.dots i{width:9px;height:9px;border-radius:50%;background:#3b2a78}.dots i:first-child{width:24px;border-radius:9px;background:#8b5cf6}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc3{text-align:center;padding:12px 4px}.sc3 img{width:52px;height:52px;object-fit:contain;margin:0 auto 4px}.sc3 b{font-size:22px;font-weight:800;display:block}.sc3 span{color:#d9ccff;font-size:14px;display:block}.up{color:var(--g);font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.t{font-size:19px;font-weight:800}
select,input,textarea{background:#10082a;border:1.5px solid #3b2a78;color:#fff;border-radius:14px;padding:9px 12px;font:inherit}input,textarea{width:100%}
.cw{position:relative;direction:ltr;margin-top:6px}.cw svg{display:block;width:100%}.tip{position:absolute;transform:translate(-50%,-100%);background:#0a1f1a;border:1.5px solid var(--g);color:var(--g);border-radius:12px;padding:1px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.tl{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer;min-height:104px}.tl>div{flex:1}.tl b{font-size:16px;font-weight:800;display:block}.tl small{color:#c9b8f5;font-size:12px}.tl img{width:70px;height:70px;object-fit:contain}
.ch{width:30px;height:30px;border-radius:50%;background:#4c2bb8;display:grid;place-items:center;flex:none;font-size:18px;font-weight:800}
.wd{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(100deg,#4b1fb0,#2a1170 60%,#6d28d9)}.wd>div{flex:1}.wd b{font-size:19px;font-weight:800;display:block}.wd small{color:#d9ccff}.wd .ch{width:46px;height:46px;font-size:26px;background:#5b35d8}.wd img{width:64px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid #3b2a78;background:#12092e;color:#e6dcff;border-radius:16px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}.chip.on{background:linear-gradient(135deg,#6d28d9,#8b5cf6);border-color:#a78bfa;box-shadow:0 0 14px #8b5cf6aa;color:#fff}
.lst{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:linear-gradient(145deg,#2b1466bb,#0f0824);border:1.5px solid #3b2a78}.lst img{width:84px;height:84px;border-radius:16px;object-fit:cover;flex:none}.lst>div{flex:1}.lst b{font-size:16px;line-height:1.4;display:block}.m{color:#b9a8e8;font-size:13px}
.dm{font-size:12px;color:#c9b8f5;text-align:center;border:1px dashed #4b2fb0;border-radius:12px;padding:5px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;direction:ltr;border-bottom:1px solid #3b2a78;border-left:1px solid #3b2a78;padding-left:4px}.bars i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#d946ef,#7c3aed)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#d946ef,#7c3aed);flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(145deg,#2b146699,#0f0824);border:1.5px solid #3b2a78;cursor:pointer;font-weight:700;font-size:17px}.opt.on{border-color:#a78bfa;box-shadow:0 0 16px #8b5cf688}.opt span:first-child{font-size:24px}
.ba{display:flex;direction:ltr;margin:-26px auto 0;position:relative;width:230px;border-radius:99px;background:#2a1170;border:1.5px solid #6d28d9;overflow:hidden}.ba button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:8px;cursor:pointer}.ba button.on{background:#7c3aed}
.cm{display:flex;gap:10px}.cm .a{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.nt{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);background:#2a1170;border:1.5px solid #a78bfa;border-radius:16px;padding:8px 16px;font-size:13px;z-index:9;width:max-content;max-width:90%}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;align-items:flex-end;padding:8px 2px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#140a36f2,#08041a);border:1.5px solid var(--ln);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -6px 30px #7c3aed44}
nav button{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;line-height:1.15;padding:0}.bx{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:20px}.bx img{width:32px;height:32px;object-fit:contain}
nav button.on .bx{background:linear-gradient(160deg,#6d28d9,#2a1170);border:1.5px solid #a78bfa;margin-top:-26px;padding:10px 12px;box-shadow:0 0 22px #8b5cf6aa}nav button.on .bx img{width:38px;height:38px}
.scr{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px}.scr::-webkit-scrollbar{display:none}.scr .chip{white-space:nowrap}.dn{color:#ff4d5e;font-weight:700;font-size:15px}.pr{height:9px;border-radius:9px;background:#1b1040;overflow:hidden;margin:4px 0 10px}.pr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c3aed,#d946ef)}.sec{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:10px}.ic.s{width:34px;height:34px;font-size:17px}.emo{font-size:32px;filter:drop-shadow(0 0 8px #8b5cf6)}.hm{display:grid;grid-template-columns:34px repeat(8,1fr);gap:3px;direction:ltr;font-size:10px;color:#c9b8f5;align-items:center}.hm i{height:20px;border-radius:5px;display:block}.tag{background:#2a2450;color:#c3b8ff;border-radius:99px;padding:1px 9px;font-size:11px}.g2 input[type=date]{color-scheme:dark}.cd,.lst,.lst>div,.row>*{min-width:0}.lst b,.cd b{overflow-wrap:anywhere}
</style>
</head>

<main id="app"></main>
